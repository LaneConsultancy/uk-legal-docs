# Redirect www to non-www
[[redirects]]
  from = "https://www.getlegaldocs.co.uk/*"
  to = "https://getlegaldocs.co.uk/:splat"
  status = 301
  force = true

# Gumroad version retired: send old links home
[[redirects]]
  from = "/gumroad*"
  to = "/"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  publish = "."
